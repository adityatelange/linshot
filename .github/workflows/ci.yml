name: CI

on:
  push:
    branches: ["**"]
    # text and website only: nothing to build or test
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"

jobs:
  test:
    # oldest (GTK 4.6) and current (GTK 4.14) supported Ubuntu releases
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: -D warnings
      # no debug info: faster to build and much smaller to cache
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      # reuses compiled dependencies between runs
      - uses: Swatinem/rust-cache@v2
      # builds the whole program (in test mode) and runs the tests
      - run: cargo test --locked
