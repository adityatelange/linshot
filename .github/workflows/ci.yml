name: CI

on:
  push:
    branches: ["**"]
    # text and website only: nothing to build or test
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"

jobs:
  test:
    # oldest (GTK 4.6) and current (GTK 4.14) supported Ubuntu releases
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: -D warnings
      # no debug info: faster to build and much smaller to cache
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      # reuses compiled dependencies between runs
      - uses: Swatinem/rust-cache@v2
      # builds the whole program (in test mode) and runs the tests
      - run: cargo test --locked

  # The same on RPM distributions, with their own GTK / glibc: Fedora (current
  # GTK) and openSUSE Tumbleweed. The .rpm itself is built on Ubuntu, so this is
  # what shows that Linshot compiles and passes its tests against their libraries.
  test-rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            setup: dnf install -y gcc git curl tar gzip pkgconf-pkg-config gtk4-devel dbus-devel
          - image: opensuse/tumbleweed
            setup: zypper --non-interactive install gcc git curl tar gzip pkg-config gtk4-devel dbus-1-devel
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      RUSTFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
