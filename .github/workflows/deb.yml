name: Build packages (.deb, .rpm)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# needed by the release job to create the GitHub release
permissions:
  contents: write

jobs:
  deb:
    # Built on the oldest supported release: the package's glibc/GTK
    # requirements come from the build host, and the Ubuntu 22.04 build
    # (glibc 2.35, GTK 4.6) installs on Ubuntu 22.04+, Debian 12+, Mint 21+
    # and other derivatives. The .rpm is packaged from the same binary and
    # needs the same glibc / GTK (Fedora 36+, openSUSE and the like).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            distro: ubuntu22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            distro: ubuntu22.04
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # a v* tag must match Cargo.toml's version, or the packages would be
      # named and versioned after the old one
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v (bump it first)"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev pkg-config dpkg-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      # reuses compiled dependencies between runs (tests run in ci.yml)
      - uses: Swatinem/rust-cache@v2
      - run: packaging/build-deb.sh
      # same compiled binary, so this adds only the packaging step
      - run: packaging/build-rpm.sh
      - name: Check the package installs
        run: |
          sudo apt-get install -y ./dist/*.deb
          linshot --version
      - uses: actions/upload-artifact@v7
        with:
          name: linshot-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm

  # The .rpm must install on real RPM distributions, both architectures: its
  # dependencies (shared libraries) have to resolve there. Blocks the release
  # otherwise.
  rpm-check:
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "fedora:latest", arch: amd64, runner: ubuntu-latest, install: "dnf install -y"}
          - {image: "fedora:latest", arch: arm64, runner: ubuntu-22.04-arm, install: "dnf install -y"}
          - {image: "opensuse/tumbleweed", arch: amd64, runner: ubuntu-latest, install: "zypper --non-interactive install --allow-unsigned-rpm"}
          - {image: "opensuse/tumbleweed", arch: arm64, runner: ubuntu-22.04-arm, install: "zypper --non-interactive install --allow-unsigned-rpm"}
    name: rpm-check (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linshot-ubuntu22.04-${{ matrix.arch }}
          path: dist
      - name: Install the package and its dependencies
        run: |
          ${{ matrix.install }} ./dist/*.rpm
          linshot --version
          rpm -q --requires linshot | grep -c 'libgtk-4'
          rpm -V linshot

  # On a version tag (v*), publish a GitHub release with the packages from
  # every build above plus SHA256 checksums. Manual runs only build.
  release:
    needs: [deb, rpm-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linshot ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
