name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev pkg-config dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linshot-${{ matrix.runner }}
          path: dist/*.deb
