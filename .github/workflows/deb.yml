name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# needed by the release job to create the GitHub release
permissions:
  contents: write

jobs:
  deb:
    # Built on the oldest supported release: the package's glibc/GTK
    # requirements come from the build host, and the Ubuntu 22.04 build
    # (glibc 2.35, GTK 4.6) installs on Ubuntu 22.04+, Debian 12+, Mint 21+
    # and other derivatives.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            distro: ubuntu22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            distro: ubuntu22.04
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev pkg-config dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      # reuses compiled dependencies between runs (tests run in ci.yml)
      - uses: Swatinem/rust-cache@v2
      - run: packaging/build-deb.sh
      - name: Check the package installs
        run: |
          sudo apt-get install -y ./dist/*.deb
          linshot --version
      - uses: actions/upload-artifact@v7
        with:
          name: linshot-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*.deb

  # On a version tag (v*), publish a GitHub release with the packages from
  # every build above plus SHA256 checksums. Manual runs only build.
  release:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linshot ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
